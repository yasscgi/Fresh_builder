group 'com.freshstl.fresh_builder_viewport_texture'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.freshstl.fresh_builder_viewport_texture'
    compileSdk 35

    defaultConfig {
        minSdk 24
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

repositories {
    google()
    mavenCentral()
}

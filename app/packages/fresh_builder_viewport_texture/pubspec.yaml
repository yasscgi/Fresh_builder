name: fresh_builder_viewport_texture
description: Native Flutter texture bridge for Fresh Builder viewport frames.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: FreshBuilderViewportTexturePluginCApi

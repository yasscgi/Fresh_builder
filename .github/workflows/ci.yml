name: Fresh Builder CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:

jobs:
  native-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Test reusable Rust workspace
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd rust
          cargo test --workspace

  flutter-bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux prerequisites
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa

      - name: Install stable Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: Install flutter_rust_bridge codegen
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Flutter packages
        shell: bash
        run: |
          export PATH="$HOME/flutter/bin:$HOME/.cargo/bin:$PATH"
          cd app
          flutter pub get

      - name: Generate Flutter/Rust bridge
        shell: bash
        run: |
          export PATH="$HOME/flutter/bin:$HOME/.cargo/bin:$PATH"
          cd app
          flutter_rust_bridge_codegen generate

      - name: Test Flutter-facing Rust crate
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd app/rust
          cargo test

      - name: Flutter analyze
        shell: bash
        run: |
          export PATH="$HOME/flutter/bin:$HOME/.cargo/bin:$PATH"
          cd app
          flutter analyze

name: Fresh Builder CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  native-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test reusable Rust workspace
        working-directory: rust
        run: cargo test --workspace

  flutter-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install flutter_rust_bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Generate Flutter/Rust bridge
        working-directory: app
        run: flutter_rust_bridge_codegen generate

      - name: Test Flutter-facing Rust crate
        working-directory: app/rust
        run: cargo test

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Flutter tests
        working-directory: app
        run: flutter test

  windows-texture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install flutter_rust_bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Generate Windows runner
        working-directory: app
        run: flutter create --project-name fresh_builder --org com.freshstl --platforms=windows .

      - name: Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Generate Flutter/Rust bridge
        working-directory: app
        run: flutter_rust_bridge_codegen generate

      - name: Analyze viewport texture package
        working-directory: app/packages/fresh_builder_viewport_texture
        run: flutter analyze

      - name: Test viewport texture package
        working-directory: app/packages/fresh_builder_viewport_texture
        run: flutter test

      - name: Build Windows application
        working-directory: app
        run: flutter build windows --debug

  linux-texture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install flutter_rust_bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Generate Linux runner
        working-directory: app
        run: flutter create --project-name fresh_builder --org com.freshstl --platforms=linux .

      - name: Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Generate Flutter/Rust bridge
        working-directory: app
        run: flutter_rust_bridge_codegen generate

      - name: Analyze viewport texture package
        working-directory: app/packages/fresh_builder_viewport_texture
        run: flutter analyze

      - name: Test viewport texture package
        working-directory: app/packages/fresh_builder_viewport_texture
        run: flutter test

      - name: Build Linux application
        working-directory: app
        run: flutter build linux --debug

  macos-texture:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install flutter_rust_bridge codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Generate macOS runner
        working-directory: app
        run: flutter create --project-name fresh_builder --org com.freshstl --platforms=macos .

      - name: Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Generate Flutter/Rust bridge
        working-directory: app
        run: flutter_rust_bridge_codegen generate

      - name: Analyze viewport texture package
        working-directory: app/packages/fresh_builder_viewport_texture
        run: flutter analyze

      - name: Test viewport texture package
        working-directory: app/packages/fresh_builder_viewport_texture
        run: flutter test

      - name: Build macOS application
        working-directory: app
        run: flutter build macos --debug
